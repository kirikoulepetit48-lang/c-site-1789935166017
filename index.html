<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fake Chat Maker - Le Coffre De Jora</title>
<style>
  body{margin:0;background:#0a0a0a;color:white;font-family:Inter,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh}
  .header{padding:20px;text-align:center}
  .header h1{margin:0;font-size:28px;letter-spacing:2px}
  .header p{opacity:0.6}
  .app{display:flex;gap:30px;flex-wrap:wrap;justify-content:center;padding:20px;max-width:1100px;width:100%}
  .controls{background:#151515;padding:20px;border-radius:16px;width:320px;display:flex;flex-direction:column;gap:12px;border:1px solid #222}
  .controls input, .controls select{padding:12px;border-radius:8px;border:none;background:#222;color:white;outline:none}
  .controls button{padding:14px;border-radius:10px;border:none;background:#25D366;color:white;font-weight:bold;cursor:pointer;font-size:16px}
  .phone{width:360px;height:700px;background:#e5ddd5;border-radius:36px;border:8px solid #111;position:relative;overflow:hidden;box-shadow:0 0 40px rgba(37,211,102,0.2)}
  .phone-top{background:#075E54;height:60px;display:flex;align-items:center;padding:0 15px;gap:10px}
  .avatar{width:40px;height:40px;border-radius:50%;background:#ccc}
  .chat-area{padding:15px;display:flex;flex-direction:column;gap:8px;height:580px;overflow-y:auto;background-image:url('https://user-images.githubusercontent.com/15075759/28754037-771a1a58-75d8-11e7-90d8-5df0365c8a8d.png')}
  .bubble{max-width:70%;padding:10px 12px;border-radius:8px;font-size:14px;line-height:1.3;position:relative}
  .sent{align-self:flex-end;background:#dcf8c6;color:#000;border-top-right-radius:0}
  .received{align-self:flex-start;background:white;color:#000;border-top-left-radius:0}
  .time{font-size:10px;opacity:0.5;margin-top:4px;text-align:right}
  .footer{text-align:center;padding:20px;opacity:0.5;font-size:12px}
</style>
</head>
<body>
<div class="header">
  <h1>📦 LE COFFRE DE JORA</h1>
  <p>Partie 2 - Générateur de faux chats WhatsApp</p>
</div>
<div class="app">
  <div class="controls">
    <select id="type"><option value="sent">Moi (vert)</option><option value="received">Lui (blanc)</option></select>
    <input id="msg" placeholder="Écris le message ici...">
    <input id="name" placeholder="Nom du contact (ex: Maman)" value="Jora">
    <button onclick="addMsg()">Ajouter le message</button>
    <button onclick="clearChat()" style="background:#333">Effacer</button>
    <p style="font-size:11px;opacity:0.6">Astuce TikTok: Fais une capture d'écran du téléphone pour ta vidéo.</p>
  </div>
  <div class="phone">
    <div class="phone-top">
      <div class="avatar" style="background:url('https://i.pravatar.cc/100') center/cover"></div>
      <div><div id="contactName" style="font-weight:bold;font-size:15px">Jora</div><div style="font-size:11px;opacity:0.8">en ligne</div></div>
    </div>
    <div class="chat-area" id="chat"></div>
  </div>
</div>
<div class="footer">Créé pour Le Coffre De Jora - Partie 2/100</div>
<script>
  const chat=document.getElementById('chat');
  function addMsg(){
    const text=document.getElementById('msg').value;
    const type=document.getElementById('type').value;
    const name=document.getElementById('name').value;
    if(!text) return;
    document.getElementById('contactName').innerText=name||'Jora';
    const div=document.createElement('div');
    div.className='bubble '+type;
    div.innerHTML=text+'<div class=time>'+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})+' ✓✓</div>';
    chat.appendChild(div);
    document.getElementById('msg').value='';
    chat.scrollTop=chat.scrollHeight;
  }
  function clearChat(){chat.innerHTML='';}
  document.getElementById('msg').addEventListener('keydown',e=>{if(e.key==='Enter')addMsg()});
  setTimeout(()=>{document.getElementById('msg').value="Tu as ouvert le coffre ?"; addMsg();},500);
  setTimeout(()=>{document.getElementById('type').value='received'; document.getElementById('msg').value="Oui c'est incroyable ce site 😱"; addMsg(); document.getElementById('type').value='sent';},1200);
</script>
</body>
</html>
